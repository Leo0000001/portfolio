<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>leo-builds.com – Gleich zurück</title>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0F14; --bg-card: #171A22;
      --border: #2E3340; --text: #F0EDE8;
      --text-muted: #9CA3AF; --accent: #4F8EF7; --accent-dim: #1E3A6E;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
      text-align: center; position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,142,247,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo { font-size: 1rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; margin-bottom: 3rem; }
    .logo span { color: var(--accent); }
    .icon { width: 64px; height: 64px; background: var(--accent-dim); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
    .icon svg { width: 30px; height: 30px; color: var(--accent); }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.025em; margin-bottom: 0.75rem; line-height: 1.15; }
    p { font-size: 1rem; color: var(--text-muted); max-width: 380px; line-height: 1.75; margin-bottom: 2rem; }
    .contact {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.7rem 1.2rem;
      font-size: 0.875rem; color: var(--text-muted);
      text-decoration: none; transition: border-color 0.2s, color 0.2s;
    }
    .contact:hover { border-color: var(--accent); color: var(--accent); }
    .contact svg { width: 15px; height: 15px; flex-shrink: 0; }
    .footer { position: absolute; bottom: 1.5rem; font-size: 0.75rem; color: var(--text-muted); opacity: 0.5; }
  </style>
</head>
<body>

  <div class="logo">leo<span>-builds</span>.com</div>

  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
    </svg>
  </div>

  <h1>Gleich zurück.</h1>
  <p>Die Seite wird gerade aktualisiert. In Kürze ist alles wieder erreichbar.</p>

  <a href="in Arbeit" class="contact">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
    in Arbeit
  </a>

  <div class="footer">© 2026 · leo-builds.com</div>

</body>
</html>
